# starship prompt — managed by github.com/josecolella/dotfiles
# Docs: https://starship.rs/config/

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$ruby\
$rust\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
stashed = "*${count}"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"

[ruby]
symbol = " "
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
format = "via [$symbol($version )]($style)"
